    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            overflow-x: hidden;
            overflow-y: auto;
            height: 100%;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #022b55;
            min-height: 100%;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            max-width: 100vw;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #022b55;
            padding: 20px;
            border-radius: 0px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
        }
        
        .content > :not(.section) {
            margin-bottom: 16px;
        }
        
        .content > :not(.section):last-child {
            margin-bottom: 0;
        }
        
        .content > .section {
            margin-bottom: 0;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        @keyframes pulseBtn {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            }
        }
        
        @keyframes shakeBtn {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
            95% { transform: translateX(0); }
        }
        
        @keyframes glowBtn {
            0%, 100% {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.2), 0 4px 14px rgba(0, 0, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 30px currentColor, 0 4px 14px rgba(0, 0, 0, 0.2);
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0px;
            }
            
            .container {
                padding: 16px;
            }
        }
    </style>
</head>

    (function() {

      var exitPopupStateKey = 'exitPopupState_' + window.location.pathname;
      
      function showExitPopup() {
        if (shown || sessionStorage.getItem('exitPopupClosed')) return;
        shown = true;
        popup.style.display = 'flex';
      }
      
      // Mouse leave detection (desktop)
      document.addEventListener('mouseout', function(e) {
        if (e.clientY < 10) showExitPopup();
      });
      
      // Scroll to top detection (mobile) - delay activation to avoid triggering on page load
      var scrollDetectionReady = false;
      var userHasScrolled = false;
      setTimeout(function() { scrollDetectionReady = true; }, 3000);
      window.addEventListener('scroll', function() { userHasScrolled = true; }, { once: true });
      document.addEventListener('touchend', function() {
        if (!scrollDetectionReady || !userHasScrolled) return;
        var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop <= 0) {
          setTimeout(showExitPopup, 500);
        }
      });
      
      // Back button detection - improved logic
      // Only add our state if we don't already have one
      if (!window.history.state || !window.history.state.exitPopup) {
        window.history.replaceState({exitPopup: true, originalState: window.history.state}, '', window.location.href);
        window.history.pushState({exitPopup: true, isExitTrap: true}, '', window.location.href);
      }
      
      window.addEventListener('popstate', function(e) {
        // Check if this is our exit trap state being popped
        if (e.state && e.state.exitPopup && !e.state.isExitTrap) {
          // User pressed back and hit our trap, show popup and re-add trap
          if (!shown && !sessionStorage.getItem('exitPopupClosed')) {

            showExitPopup();
          }
        } else if (!e.state || (!e.state.exitPopup)) {
          // User is actually navigating away (came from external page), let them go
          // but try to show popup first
          if (!shown && !sessionStorage.getItem('exitPopupClosed')) {
            showExitPopup();
          }
        }
      });
      
      // Fallback: beforeunload for closing tab/window
      window.addEventListener('beforeunload', function(e) {
        if (!shown && !sessionStorage.getItem('exitPopupClosed')) {
          showExitPopup();
        }
      });
    })();
